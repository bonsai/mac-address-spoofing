<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>WiFi MAC Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
         background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b949e; margin-bottom: 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
       color: #8b949e; border-bottom: 1px solid #21262d; padding-bottom: 6px; margin: 24px 0 10px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #161b22; border: 1px solid #21262d; border-radius: 8px;
          padding: 10px 14px; min-width: 120px; }
  .card .k { color: #8b949e; font-size: 11px; text-transform: uppercase; }
  .card .v { font-size: 18px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  th { color: #8b949e; font-size: 11px; text-transform: uppercase; }
  tr.upcoming td { color: #d29922; }
  tr.due td { color: #f85149; }
  .ok { color: #3fb950; } .ng { color: #f85149; } .mute { color: #8b949e; }
  .pill { border: 1px solid currentColor; border-radius: 99px; padding: 0 8px; font-size: 11px; }
</style>

<h1>WiFi MAC Dashboard</h1>
<div class="sub" id="sub">loading…</div>

<h2>Status</h2>
<div class="cards" id="cards"></div>

<h2>予定 (future, 同一管理)</h2>
<table id="plan"><thead>
  <tr><th>#</th><th>実行予定</th><th>まで</th><th>task</th><th>state</th></tr>
</thead><tbody></tbody></table>

<h2>実績 (recent)</h2>
<table id="done"><thead>
  <tr><th>時刻</th><th>cmd</th><th>mac</th><th>ok</th><th>note</th></tr>
</thead><tbody></tbody></table>

<script>
const fmt = (s) => {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return String(s);
  return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
};
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

function card(k, v, cls) {
  const c = el("div", "card");
  c.append(el("div", "k", k), el("div", "v " + (cls || ""), v));
  return c;
}

function render(d) {
  document.getElementById("sub").textContent =
    `now ${d.now_local} ・ generated ${fmt(d.generated_at)}`;

  const cards = document.getElementById("cards");
  cards.replaceChildren(
    card("current mac", d.current_mac?.mac ?? "?", "ok"),
    card("rotations ok", d.stats.rotations_ok, "ok"),
    card("failed", d.stats.rotations_failed, "ng"),
    card("planned", d.stats.planned, "mute"),
    card("records", d.stats.total_records),
  );

  const plan = document.querySelector("#plan tbody");
  plan.replaceChildren();
  if (!d.planned.length) {
    const tr = el("tr"); const td = el("td", "mute", "予定なし");
    td.colSpan = 5; tr.append(td); plan.append(tr);
  }
  for (const p of d.planned) {
    const tr = el("tr", p.state);
    tr.append(
      el("td", null, `${p.run ?? "-"}/${p.of ?? "-"}`),
      el("td", null, fmt(p.t)),
      el("td", null, p.in_min > 0 ? `${p.in_min} min` : "まもなく"),
      el("td", null, p.task ?? "—"),
      el("td", null, p.state),
    );
    plan.append(tr);
  }

  const done = document.querySelector("#done tbody");
  done.replaceChildren();
  for (const r of d.recent) {
    const tr = el("tr");
    const okTd = el("td");
    if (r.ok === true) okTd.append(el("span", "ok", "✔ ok"));
    else if (r.ok === false) okTd.append(el("span", "ng", "✘ fail"));
    else okTd.append(el("span", "mute", "—"));
    tr.append(
      el("td", null, fmt(r.t ?? r.time)),
      el("td", null, r.cmd ?? "—"),
      el("td", null, r.mac ?? "—"),
      okTd,
      el("td", "mute", r.note ?? ""),
    );
    done.append(tr);
  }
}

fetch("../../data/dashboard.json?_=" + Date.now())
  .then((r) => r.json())
  .then(render)
  .catch((e) => { document.getElementById("sub").textContent = "error: " + e.message; });

// 60s auto refresh
setInterval(() => location.reload(), 60000);
</script>
</html>
